name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * 1"

jobs:
  tests:
    name: Regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Run test suites
        run: |
          for t in tests/verify_*.py; do
            echo "== $t =="
            uv run --python 3.13 --with 'homeassistant==2025.1.4' python "$t"
          done
      - name: Run the infrared test on Home Assistant 2026.10
        run: >-
          uv run --python 3.14 --with 'homeassistant==2026.10.4'
          --with 'infrared-protocols==10.1.0' python tests/verify_infrared.py

  hassfest:
    name: hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: hacs/action@main
        with:
          category: integration
