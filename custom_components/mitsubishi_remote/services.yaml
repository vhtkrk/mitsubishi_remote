force_send:
  name: Force send IR command
  description: >-
    Encode and send one Mitsubishi IR frame. The climate entity state does
    not change. Use it to test a setting before you rely on the UI.
  target:
    entity:
      integration: mitsubishi_remote
      domain: climate
  fields:
    hvac_mode:
      name: HVAC mode
      description: Operation mode.
      required: true
      default: cool
      selector:
        select:
          options:
            - cool
            - heat
            - dry
            - auto
            - "off"
    temperature:
      name: Temperature
      description: Target temperature in Celsius (16-31).
      required: false
      default: 24
      selector:
        number:
          min: 16
          max: 31
          step: 1
          unit_of_measurement: "°C"
    fan_mode:
      name: Fan mode
      description: >-
        Fan speed. VANE (up/down airflow) is Auto for this diagnostic call.
        The other settings keep the entity's current state.
      required: false
      default: auto
      selector:
        select:
          options:
            - auto
            - low
            - medium
            - high
            - super_high
    power:
      name: Power
      description: Power on/off bit.
      required: false
      default: true
      selector:
        boolean:
